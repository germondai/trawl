name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify; defaults to the triggering ref
        required: false
        type: string
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      - run: bun install --frozen-lockfile
      - run: python3 -m unittest discover -s packages/browser/security -p 'test_*.py'
      - run: bun run verify
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check the packed client in Node, Bun and Deno
        run: bun scripts/check-client-package.ts

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Build standard runtime
        run: docker build -f apps/api/Dockerfile -t trawl-smoke .
      - name: Test offline WAF worker integration
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m
          --memory=512m --cpus=2 --pids-limit=128
          -v "$PWD/packages/tiers/tests:/app/packages/tiers/tests:ro"
          --entrypoint bun trawl-smoke test packages/tiers/tests/waf.test.ts
      - name: Test owned browser fixtures
        run: bash scripts/browser-smoke.sh trawl-smoke
      - name: Test native TLS transport with owned browser fixtures
        env:
          TIER1_TRANSPORT: wreq
        run: bash scripts/browser-smoke.sh trawl-smoke
