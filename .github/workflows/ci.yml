name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify; defaults to the triggering ref
        required: false
        type: string
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run verify

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Build standard runtime
        run: docker build -f apps/api/Dockerfile -t trawl-smoke .
      - name: Test owned browser fixtures
        run: bash scripts/browser-smoke.sh trawl-smoke
