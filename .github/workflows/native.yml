name: Native distributions

on:
  workflow_dispatch:
  push:
    branches: [feat/v2-platform]
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/desktop/**"
      - "apps/api/**"
      - "packages/browser/**"
      - "packages/tiers/**"
      - "packages/types/**"
      - "packages/client/**"
      - "native/powsolve/**"
      - "tools/wafmeow/**"
      - "scripts/check-cli-package.ts"
      - "scripts/check-client-package.ts"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - "packages/cli/**"
      - "packages/config/**"
      - "packages/runtime/**"
      - "native/launcher/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
      GOMAXPROCS: "2"
      TRAWL_BUILD_MIN_FREE_GIB: "4"
      TRAWL_HOME: ${{ github.workspace }}/.artifacts/v2/smoke-home
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/wafmeow/go.mod
          cache-dependency-path: tools/wafmeow/go.sum
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb fonts-dejavu fonts-liberation libasound2t64 libdbus-glib-1-2 libgtk-3-0t64 libnss3 libnspr4 libx11-xcb1 libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxi6 libxrandr2 libxss1 libxtst6 libgbm1
      - run: bun install --frozen-lockfile
      - name: Check new package behavior
        run: bun test packages/config/tests packages/runtime/tests packages/cli/tests packages/client/tests
      - name: Build SDK and CLI
        run: bun --cwd packages/client build && bun --cwd packages/cli build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check packed SDK and CLI
        run: bun scripts/check-client-package.ts && bun scripts/check-cli-package.ts
      - name: Build runtime and install pinned browser
        run: |
          bun --cwd packages/runtime build
          bun packages/cli/src/index.ts browser install
      - name: Check native API, browser, sessions and compatibility endpoint
        run: python packages/runtime/scripts/smoke.py --home "$TRAWL_HOME" --output .artifacts/v2/native-smoke.json --observability
      - name: Build desktop without publishing
        run: bun --cwd apps/desktop native:build
      - name: Verify macOS app seal and bundled runtime
        if: runner.os == 'macOS'
        run: |
          bun --cwd apps/desktop native:package --bundles app --config '{"build":{"beforeBuildCommand":""}}'
          codesign --verify --deep --strict apps/desktop/src-tauri/target/release/bundle/macos/TRAWL.app
          bun -e 'import { verifyRuntime } from "./packages/runtime/src/assets.ts"; await verifyRuntime("./apps/desktop/src-tauri/target/release/bundle/macos/TRAWL.app/Contents/Resources/runtime"); console.log("Packaged runtime integrity verified")'
      - name: Check native lifecycle helpers
        run: cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Package desktop installer
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$RUNNER_OS" in
            macOS) bundles=dmg ;;
            Linux) bundles=deb ;;
            Windows) bundles=nsis ;;
            *) exit 1 ;;
          esac
          bun --cwd apps/desktop native:package --bundles "$bundles" --config '{"build":{"beforeBuildCommand":""}}'
      - name: Retain desktop installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: trawl-desktop-${{ matrix.runner }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
      - name: Retain verification report
        uses: actions/upload-artifact@v7
        with:
          name: native-report-${{ matrix.runner }}
          path: .artifacts/v2/native-smoke.json
          retention-days: 7
          if-no-files-found: error
