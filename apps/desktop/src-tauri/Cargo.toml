[package]
name = "trawl-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[profile.release.build-override]
# Build-time proc macros must remain loadable by macOS dyld after linking.
strip = "none"

[lib]
name = "trawl_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webpki-root-certs = "1.0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "net", "macros"] }
libc = "0.2"
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "android")'.dependencies]
trawl-mobile-runtime = { path = "../../../native/mobile-runtime" }
jni = "0.22.4"
semver = "1"


[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSImage", "NSWindow", "NSView", "NSButton", "NSScreen", "NSHapticFeedback", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData", "NSLocale", "NSArray", "NSNotification", "NSOperation", "NSProcessInfo", "NSString", "block2"] }
