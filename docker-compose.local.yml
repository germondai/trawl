services:
  redis:
    image: redis:8.10.3-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s

  trawl:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT:-8191}:8191"
      - "${MITM_PORT:-8192}:${MITM_PORT:-8192}"
    shm_size: 1gb
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      SESSION_CACHE_DRIVER: ${SESSION_CACHE_DRIVER:-redis}
      REDIS_URL: redis://redis:6379
      REDIS_SESSION_TTL_SECONDS: ${REDIS_SESSION_TTL_SECONDS:-3600}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BROWSER_BLOCK_ADS: ${BROWSER_BLOCK_ADS:-true}
      SCRAPE_MIN_TIER: ${SCRAPE_MIN_TIER:-1}
      TIER1_TRANSPORT: ${TIER1_TRANSPORT:-bun}
      WAF_DETECTION_ENABLED: ${WAF_DETECTION_ENABLED:-true}
      SCRAPE_MAX_TIMEOUT_MS: ${SCRAPE_MAX_TIMEOUT_MS:-60000}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      METRICS_DASHBOARD_ENABLED: ${METRICS_DASHBOARD_ENABLED:-false}
    volumes:
      - trawl_proxy_ca:/data/proxy-ca
      - trawl_metrics:/data/metrics
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  redis_data:
  trawl_proxy_ca:
  trawl_metrics:
