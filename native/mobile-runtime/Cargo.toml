[package]
name = "trawl-mobile-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webpki-root-certs = "1.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "fs", "macros", "io-util"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
scraper = "0.29.0"

base64 = "0.23.1"
